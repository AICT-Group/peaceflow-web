<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danke – Newsletter | peaceflow</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/img/icon.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e6be1b">
  <meta property="og:title" content="Du bist dabei – peaceflow Newsletter">
  <meta property="og:description" content="Danke! Wir haben dich für unseren Newsletter vorgemerkt.">
  <meta property="og:image" content="https://peaceflow.ai/img/Chamaeleon.png">
  <meta property="og:url" content="https://peaceflow.ai/newsletter-danke/">
  <!-- Brand fonts (Adobe kit) with safe system fallback -->
  <link rel="stylesheet" href="https://use.typekit.net/uus7iqo.css">
  <style>
    :root{
      --gold:#e6be1b; --teal:#5a8a95; --ink:#111111; --body:#2b2b2b;
      --mute:#6e6e6e; --paper:#f6f6f6;
      --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      background:var(--paper);color:var(--body);font-family:var(--sans);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:24px;line-height:1.6;
    }
    .card{
      background:#fff;border-radius:24px;max-width:560px;width:100%;
      padding:48px 40px;text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.06);
    }
    .wordmark{
      font-family:'Courier New',Courier,monospace;letter-spacing:3px;
      font-size:18px;font-weight:700;color:var(--gold);margin-bottom:28px;
    }
    .check{
      width:72px;height:72px;border-radius:50%;background:var(--gold);
      display:flex;align-items:center;justify-content:center;margin:0 auto 24px;
    }
    .check svg{width:36px;height:36px;}
    h1{
      margin:0 0 14px;font-size:28px;line-height:1.25;font-weight:700;color:var(--ink);
    }
    p{margin:0 0 14px;font-size:17px;color:var(--body);}
    .mute{color:var(--mute);font-size:15px;}
    .btn{
      display:inline-block;margin-top:22px;padding:14px 30px;border-radius:9999px;
      background:var(--gold);color:var(--ink);text-decoration:none;font-weight:600;
      font-size:16px;border:2px solid var(--gold);
    }
    .btn.secondary{background:#fff;color:var(--teal);border-color:var(--teal);margin-left:10px;}
    .links{margin-top:26px;}
    @media (max-width:480px){
      .card{padding:36px 22px;}
      h1{font-size:24px;}
      .btn.secondary{margin-left:0;margin-top:10px;}
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="wordmark">peaceflow</div>
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Du bist dabei – danke!</h1>
    <p>Wir haben dich für unseren Newsletter vorgemerkt.</p>
    <p class="mute">Wir teilen Einblicke in peaceflow und neue Perspektiven auf Konflikte. Kein Spam, jederzeit mit einem Klick abbestellbar.</p>
    <div class="links">
      <a class="btn" href="https://app.peaceflow.ai">peaceflow öffnen</a>
      <a class="btn secondary" href="/de/">zur Startseite</a>
    </div>
  </main>
</body>
</html>
